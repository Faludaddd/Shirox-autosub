name: Build and upload nightly

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set build version
        run: |
          # **Source of truth for MARKETING_VERSION is the VERSION file in the
          # repo root.** The previous workflow hardcoded "1.4" in the comment
          # and only bumped CURRENT_PROJECT_VERSION from github.run_number —
          # so MARKETING_VERSION got stuck at whatever was last manually
          # edited in project.pbxproj (1.23 since v1.23, never bumped again).
          #
          # Now: read VERSION, set both MARKETING_VERSION and
          # CURRENT_PROJECT_VERSION in project.pbxproj. To bump the displayed
          # version, edit VERSION and push — no other steps required.
          if [ ! -f VERSION ]; then
            echo "VERSION file missing — falling back to 1.0"
            MARKETING="1.0"
          else
            MARKETING=$(tr -d '[:space:]' < VERSION)
            echo "Read MARKETING_VERSION=$MARKETING from VERSION file"
          fi
          BUILD_NUM="${{ github.run_number }}"
          echo "Setting MARKETING_VERSION=$MARKETING, CURRENT_PROJECT_VERSION=$BUILD_NUM"
          sed -i '' "s/MARKETING_VERSION = [0-9.]*/MARKETING_VERSION = $MARKETING/g" Shirox.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUM/g" Shirox.xcodeproj/project.pbxproj
          echo "## Build Version" >> $GITHUB_STEP_SUMMARY
          echo "**Marketing version:** $MARKETING" >> $GITHUB_STEP_SUMMARY
          echo "**Build number:** $BUILD_NUM (GitHub run #${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY

      - name: Make build script executable
        run: chmod +x ./buildipa.sh

      - name: Build iOS IPA
        id: build_ipa
        run: ./buildipa.sh

      # Publish the IPA to the beta release IMMEDIATELY after a successful
      # build. `if: always()` plus an explicit file-existence guard means the
      # IPA is uploaded on EVERY successful build, even if later steps fail.
      - name: Upload IPA to beta release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build/Shirox.ipa ]; then
            echo "build/Shirox.ipa not found — build step did not produce an IPA. Skipping release upload."
            exit 0
          fi
          gh release create beta --title "beta" --notes "Latest nightly build" 2>/dev/null || true
          gh release upload beta build/Shirox.ipa --clobber
          # Keep the checksum artifact in sync with the freshly uploaded IPA
          # (v2.12). It used to be stale since Aug 4 — anyone verifying a
          # download against it got a false mismatch.
          shasum -a 256 build/Shirox.ipa > build/Shirox.ipa.sha256
          sed -i '' "s|build/Shirox.ipa|Shirox.ipa|" build/Shirox.ipa.sha256
          gh release upload beta build/Shirox.ipa.sha256 --clobber

      # Artifact upload is a convenience for the Actions UI / debugging. It is
      # non-critical: if it fails the IPA is still available via the beta
      # release above, so we let it fail without failing the whole job.
      - name: Upload IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Shirox-Nightly-IPA
          path: build/Shirox.ipa

      # apps.json metadata refresh is also non-critical — the release already
      # exists with the IPA attached by this point. Continue-on-error keeps a
      # bad git push (e.g. race with another run) from turning the run red.
      - name: Update apps.json
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA_SIZE=$(wc -c < build/Shirox.ipa | tr -d ' ')
          BUILD_DATE=$(date -u +%Y-%m-%d)
          jq --argjson size "$IPA_SIZE" --arg date "$BUILD_DATE" \
            '.apps[0].versions[0].size = $size | .apps[0].versions[0].date = $date' \
            apps.json > apps.json.tmp && mv apps.json.tmp apps.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --cached --quiet || (git commit -m "chore: update apps.json [skip ci]" && git push origin HEAD:main)
