# shamelessly copied from https://github.com/cranci1/Luna/blob/main/.github/workflows/build.yml

name: Build and upload nightly

on:
 push:
   branches:
     - main

env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
 build-ios:
   name: Build iOS IPA
   runs-on: macos-26
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@v6

     - name: Bump build version
       run: |
         # Auto-increment the build version on every CI run so each IPA
         # has a unique, increasing version number. Uses the GitHub run
         # number as the build version — it's monotonically increasing
         # across all pushes to main, so every build is distinguishable.
         BUILD_NUM="${{ github.run_number }}"
         MARKETING_VER=$(date -u +'%Y.%-m.%-d')
         echo "Setting CURRENT_PROJECT_VERSION=$BUILD_NUM and MARKETING_VERSION=$MARKETING_VER"
         sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUM/g" Shirox.xcodeproj/project.pbxproj
         sed -i '' "s/MARKETING_VERSION = [0-9.]*/MARKETING_VERSION = $MARKETING_VER/g" Shirox.xcodeproj/project.pbxproj
         echo "## Build Version" >> $GITHUB_STEP_SUMMARY
         echo "**Marketing version:** $MARKETING_VER" >> $GITHUB_STEP_SUMMARY
         echo "**Build number:** $BUILD_NUM (GitHub run #${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY

     - name: Make build script executable
       run: chmod +x ./buildipa.sh

     - name: Build iOS IPA
       id: build_ipa
       run: ./buildipa.sh

     # #116 — Publish the IPA to the beta release IMMEDIATELY after a successful
     # build. This step is `if: always()` with an explicit file-existence guard,
     # so the IPA is uploaded on EVERY successful build even if the later
     # artifact-upload or apps.json steps fail. Order matters: the release
     # upload happens *before* anything else that could fail, so there is no
     # prior-step dependency that can prevent the IPA from being published.
     - name: Upload IPA to beta release
       if: always()
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         if [ ! -f build/Shirox.ipa ]; then
           echo "build/Shirox.ipa not found — build step did not produce an IPA. Skipping release upload."
           exit 0
         fi
         gh release create beta --title "beta" --notes "Latest nightly build" 2>/dev/null || true
         gh release upload beta build/Shirox.ipa --clobber

     # Artifact upload is a convenience for the Actions UI / debugging. It is
     # non-critical: if it fails the IPA is still available via the beta
     # release above, so we let it fail without failing the whole job.
     - name: Upload IPA artifact
       continue-on-error: true
       uses: actions/upload-artifact@v7
       with:
         name: Shirox-Nightly-IPA
         path: build/Shirox.ipa

     # apps.json metadata refresh is also non-critical — the release already
     # exists with the IPA attached by this point. Continue-on-error keeps a
     # bad git push (e.g. race with another run) from turning the run red.
     - name: Update apps.json
       continue-on-error: true
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         IPA_SIZE=$(wc -c < build/Shirox.ipa | tr -d ' ')
         BUILD_DATE=$(date -u +%Y-%m-%d)
         jq --argjson size "$IPA_SIZE" --arg date "$BUILD_DATE" \
           '.apps[0].versions[0].size = $size | .apps[0].versions[0].date = $date' \
           apps.json > apps.json.tmp && mv apps.json.tmp apps.json
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"
         git add apps.json
         git diff --cached --quiet || (git commit -m "chore: update apps.json [skip ci]" && git push origin HEAD:main)

 build-catalyst:
   name: Build Mac Catalyst DMG
   runs-on: macos-26
   permissions:
     contents: write
   steps:
     - name: Checkout repository
       uses: actions/checkout@v6

     - name: Bump build version
       run: |
         BUILD_NUM="${{ github.run_number }}"
         MARKETING_VER=$(date -u +'%Y.%-m.%-d')
         sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUM/g" Shirox.xcodeproj/project.pbxproj
         sed -i '' "s/MARKETING_VERSION = [0-9.]*/MARKETING_VERSION = $MARKETING_VER/g" Shirox.xcodeproj/project.pbxproj

     - name: Make build script executable
       run: chmod +x ./buildcatalyst.sh

     - name: Build Mac Catalyst DMG
       run: ./buildcatalyst.sh

     - name: Upload Catalyst DMG
       uses: actions/upload-artifact@v7
       with:
         name: Shirox-Nightly-Catalyst-DMG
         path: build/Shirox-Catalyst.dmg

     - name: Upload Catalyst DMG to beta release
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         gh release create beta --title "beta" --notes "Latest nightly build" 2>/dev/null || true
         gh release upload beta build/Shirox-Catalyst.dmg --clobber
